[package]
name = "thejas32-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral Access Crate for C-DAC VEGA THEJAS32 RISC-V SoC"
license = "MIT OR Apache-2.0"

[dependencies]
critical-section = { version = "1.1", optional = true }
riscv = "0.11"
riscv-rt = { version = "0.12", optional = true }
vcell = "0.1"

[features]
rt = ["riscv-rt", "riscv/critical-section-single-hart"]
