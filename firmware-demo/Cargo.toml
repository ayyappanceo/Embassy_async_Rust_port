[package]
name = "firmware-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
thejas32-pac = { path = "../thejas32-pac", features = ["rt"] }
thejas32-hal = { path = "../thejas32-hal" }
embedded-hal = "1.0.0"
embassy-executor = { version = "0.6", features = ["arch-spin", "executor-thread"] }
embassy-time = { version = "0.3", features = ["tick-hz-1_000_000", "generic-queue-8"] }
portable-atomic = { version = "1", features = ["critical-section"] }
riscv = { version = "0.11", features = ["critical-section-single-hart"] }
riscv-rt = "0.12"
panic-halt = "0.2"
